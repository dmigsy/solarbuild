name: Smyths PS5 stock check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (fits GitHub's free private-repo minutes)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 stock-checker/check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
